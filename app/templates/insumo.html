{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <h2 class="mb-4">
        Tabela de Insumos
    </h2>

    <table class="table table-striped table-bordered">

        <thead class="thead-dark">

            <tr>

                <th>Nome</th>
                <th>Custo Unitário</th>
                <th>Quantidade</th>

            </tr>

        </thead>

        <tbody>

            {% for insumos in insumos %}

            <tr>

                <td>{{ insumos.nome }}</td>
                <td>{{ insumos.custo_unitario }}</td>
                <td>{{ insumos.quantidade }}</td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>

{% endblock %}
