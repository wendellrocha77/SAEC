{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <h2 class="mb-4">
        Tabela de Relatórios
    </h2>

    <table class="table table-striped table-bordered">

        <thead class="thead-dark">

            <tr>

                <th>Data Geração</th>
                <th>Descrição</th>
                <th>Propriedade</th>

            </tr>

        </thead>

        <tbody>

            {% for relatorios in relatorios %}

            <tr>

                <td>{{ relatorios.data_geracao }}</td>
                <td>{{ relatorios.descricao }}</td>
                <td>{{ relatorios.propriedade }}</td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>

{% endblock %}
