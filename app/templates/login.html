{% extends 'base.html' %}

{% block content %}

<div class="container mt-5" style="max-width: 400px;">

    <h2 class="mb-4 text-center">
        Login SAEC
        {% if erro %}

        <div class="alert alert-danger">

            {{ erro }}

        </div>

        {% endif %}
    </h2>

    <form method="POST">

        {% csrf_token %}

        <div class="form-group">
            <label>Usuário</label>

            <input type="text"
                   name="username"
                   class="form-control">
        </div>

        <div class="form-group">
            <label>Senha</label>

            <input type="password"
                   name="password"
                   class="form-control">
        </div>

        <button type="submit"
                class="btn btn-success btn-block">

            Entrar

        </button>

    </form>

</div>

{% endblock %}
