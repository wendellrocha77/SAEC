{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}

<div class="dashboard-container auth-container">

    <div class="auth-card">
        <div class="auth-logo">
            <span aria-hidden="true">☕</span>
        </div>

        <h2 class="page-title">Login SAEC</h2>

        {% if erro %}
        <div class="alert alert-danger">
            {{ erro }}
        </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="username">Usuário</label>
                <input type="text"
                       id="username"
                       name="username"
                       class="form-control"
                       autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password"
                       id="password"
                       name="password"
                       class="form-control"
                       autocomplete="current-password">
            </div>

            <button type="submit" class="btn btn-success btn-block">
                Entrar
            </button>
        </form>
    </div>

</div>

{% endblock %}
