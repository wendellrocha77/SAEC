{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <h2 class="mb-4">
        Tabela de Histórico de Análises
    </h2>

    <table class="table table-striped table-bordered">

        <thead class="thead-dark">

            <tr>

                <th>Data</th>
                <th>Resultado</th>
                <th>Usuário</th>

            </tr>

        </thead>

        <tbody>

            {% for historicos in historicos %}

            <tr>

                <td>{{ historicos.data }}</td>
                <td>{{ historicos.resultado }}</td>
                <td>{{ historicos.usuario }}</td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>

{% endblock %}
