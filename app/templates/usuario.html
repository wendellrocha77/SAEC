{% extends 'base.html' %}

{% block title %}Usuários{% endblock %}

{% block content %}

<div class="dashboard-container">

    <header class="page-header">
        <div class="page-breadcrumb">SAEC / Administração</div>
        <h2 class="page-title">Usuários</h2>
        <p class="page-subtitle">Contas de acesso ao sistema.</p>
    </header>

    <div class="dashboard-card">
        <div class="table-responsive">
            <table class="table table-striped saec-table">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Email</th>
                        <th>Senha</th>
                    </tr>
                </thead>
                <tbody>
                    {% for usuarios in usuarios %}
                    <tr>
                        <td>{{ usuarios.nome }}</td>
                        <td>{{ usuarios.email }}</td>
                        <td>{{ usuarios.senha }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

</div>

{% endblock %}
