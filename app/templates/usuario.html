{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <h2 class="mb-4">
        Tabela de Usuários
    </h2>

    <table class="table table-striped table-bordered">

        <thead class="thead-dark">

            <tr>

                <th>Nome</th>
                <th>Email</th>
                <th>Senha</th>

            </tr>

        </thead>

        <tbody>

            {% for usuarios in usuarios %}

            <tr>

                <td>{{ usuarios.nome }}</td>
                <td>{{ usuarios.email }}</td>
                <td>{{ usuarios.senha }}</td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>

{% endblock %}
