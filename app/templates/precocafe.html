{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <h2 class="mb-4">
        Tabela de Preços do Café
    </h2>

    <table class="table table-striped table-bordered">

        <thead class="thead-dark">

            <tr>

                <th>Valor da Saca</th>
                <th>Data</th>
                <th>Mercado</th>

            </tr>

        </thead>

        <tbody>

            {% for preco in precos %}

            <tr>

                <td>R$ {{ preco.valor_saca }}</td>
                <td>{{ preco.data }}</td>
                <td>{{ preco.mercado }}</td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>

{% endblock %}
